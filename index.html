<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>โพด แก้ว</title>
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;600&family=Sarabun:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff4d6;--ink:#2b1b4a;--pop:#ff5a3c;--sun:#ffc531;--card:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#1d1433;--ink:#fff4d6;--pop:#ff7a5c;--card:#2b1f47}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Sarabun",system-ui,sans-serif;font-size:18px;line-height:1.6}
main{max-width:640px;margin:0 auto;padding:24px 20px 56px}
h1{font-family:"Mitr",system-ui,sans-serif;font-weight:600;font-size:clamp(52px,15vw,96px);line-height:1.3;margin:24px 0 0;color:var(--pop);text-shadow:4px 4px 0 var(--sun);display:flex;flex-wrap:wrap;gap:0 .35em;width:100%;align-items:center}
.w{display:inline-block;transition:transform .15s;color:var(--pop);cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.w:active{transform:scale(.92) rotate(-3deg)}
.w.off{opacity:.35;cursor:not-allowed}
#w2{margin-left:auto}
.mid{flex:1;min-width:90px;text-align:center;font-family:"Sarabun",system-ui,sans-serif;font-weight:400;font-size:13px;line-height:1.5;color:var(--ink);text-shadow:none;opacity:.8}
.card{background:var(--card);border:3px solid var(--ink);border-radius:20px;padding:18px 20px;margin-top:20px;box-shadow:6px 6px 0 var(--ink)}
.card h2{font-family:"Mitr",system-ui,sans-serif;font-size:22px;margin:0 0 8px}
.me{font-family:"Mitr",system-ui,sans-serif;font-size:20px;margin:0}
.me b{color:var(--pop);font-size:34px;font-weight:600}
input{font:inherit;color:var(--ink);background:transparent;border:2px solid var(--ink);border-radius:12px;padding:8px 12px;width:100%;margin:6px 0}
button.b{font-family:"Mitr",system-ui,sans-serif;font-size:18px;color:#fff;background:var(--pop);border:3px solid var(--ink);border-radius:14px;padding:8px 18px;cursor:pointer}
ol{list-style:none;margin:0;padding:0}
li{display:flex;align-items:baseline;gap:10px;padding:8px 0;border-top:2px dashed rgba(128,128,128,.4)}
li:first-child{border-top:0}
li .r{font-family:"Mitr",system-ui,sans-serif;width:28px;color:var(--pop)}
li .n{flex:1;overflow-wrap:anywhere}
li .n small{opacity:.6}
li .t{font-family:"Mitr",system-ui,sans-serif;font-size:22px}
li.you .n{font-weight:500}
.note{font-size:14px;opacity:.75;margin:6px 0 0}
</style>
</head>
<body>
<main>
  <h1><span class="w off" id="w1" role="button" tabindex="0">โพด</span><span class="mid">แตะแข่งกัน<br>ทุกแตะได้ 1 คะแนน</span><span class="w off" id="w2" role="button" tabindex="0">แก้ว</span></h1>

  <section class="card" id="joinCard">
    <h2>ชื่อของคุณ</h2>
    <input id="name" maxlength="16" placeholder="พิมพ์ชื่อเล่น" autocomplete="off">
    <button class="b" id="join">เริ่มเล่น</button>
  </section>

  <section class="card" id="meCard" hidden>
    <p class="me">คะแนนของ <span id="meName"></span> <b id="meScore">0</b></p>
    <p class="note" id="status"></p>
    <p class="note"><a href="#" id="chg" onclick="return false" style="color:inherit">เปลี่ยนชื่อ</a></p>
  </section>

  <section class="card">
    <h2>ตารางคะแนน</h2>
    <ol id="board"><li><span class="n">ยังไม่มีใครเล่น</span></li></ol>
  </section>
</main>
<script>
(function(){
  var $=function(i){return document.getElementById(i)};
  var cols=['#ff5a3c','#2f80ed','#27ae60','#9b51e0','#e91e8c'];
  var id=localStorage.getItem('phot-id');
  if(!id){ id=(window.crypto&&crypto.randomUUID)?crypto.randomUUID():String(Date.now())+Math.random().toString(36).slice(2); localStorage.setItem('phot-id',id); }
  var name=localStorage.getItem('phot-name')||'';
  $('name').value=name;
  var playing=false,pendP=0,pendK=0,mine=0,baseMine=0;

  function render(rows){
    rows.sort(function(a,b){return (b.p+b.k)-(a.p+a.k)});
    var ol=$('board'); ol.textContent='';
    if(!rows.length){ var e=document.createElement('li'); e.innerHTML='<span class="n">ยังไม่มีใครเล่น</span>'; ol.appendChild(e); return; }
    rows.forEach(function(r,i){
      var li=document.createElement('li'); if(r.id===id) li.className='you';
      var a=document.createElement('span'); a.className='r'; a.textContent=i+1;
      var n=document.createElement('span'); n.className='n'; n.textContent=r.name+(r.id===id?' (คุณ)':'');
      var s=document.createElement('small'); s.textContent='  โพด '+r.p+' · แก้ว '+r.k; n.appendChild(s);
      var t=document.createElement('span'); t.className='t'; t.textContent=r.p+r.k;
      li.appendChild(a);li.appendChild(n);li.appendChild(t); ol.appendChild(li);
      if(r.id===id){ baseMine=r.p+r.k; }
    });
    if(playing) $('meScore').textContent=baseMine+pendP+pendK;
  }

  function poll(){
    fetch('/api/scores').then(function(r){return r.json()}).then(function(rows){ render(rows); $('status').textContent=''; })
      .catch(function(){ $('status').textContent='เชื่อมต่อเซิร์ฟเวอร์ไม่ได้'; });
  }

  function flush(){
    if(!playing||(!pendP&&!pendK)) return;
    var p=pendP,k=pendK; pendP=0; pendK=0;
    fetch('/api/tap',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:id,name:name,p:p,k:k})})
      .then(function(r){ if(!r.ok) throw 0; poll(); })
      .catch(function(){ pendP+=p; pendK+=k; $('status').textContent='ส่งคะแนนไม่สำเร็จ กำลังลองใหม่'; });
  }

  $('join').addEventListener('click',function(){
    var v=$('name').value.trim(); if(!v){ $('name').focus(); return; }
    name=v; localStorage.setItem('phot-name',name);
    playing=true; $('meName').textContent=name; $('meCard').hidden=false; $('joinCard').hidden=true;
    $('w1').classList.remove('off'); $('w2').classList.remove('off');
    fetch('/api/tap',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:id,name:name,p:0,k:0})}).then(poll);
  });

  $('chg').addEventListener('click',function(){
    flush(); playing=false;
    $('meCard').hidden=true; $('joinCard').hidden=false;
    $('w1').classList.add('off'); $('w2').classList.add('off');
    $('name').focus();
  });
  if(name){ $('join').click(); }

  function bind(wid,which){
    var w=$(wid),c=0;
    function hit(){
      if(!playing) return;
      if(which==='p') pendP++; else pendK++;
      c++; w.style.color=cols[c%cols.length];
      $('meScore').textContent=baseMine+pendP+pendK;
    }
    w.addEventListener('click',hit);
    w.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();hit()}});
  }
  bind('w1','p'); bind('w2','k');

  setInterval(flush,400);
  setInterval(poll,1000);
  poll();
})();
</script>
</body>
</html>
